name: Bug report
description: Something in Clipio does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and desktop
      placeholder: "Windows 11 / macOS 15 / Arch Linux, Hyprland (Wayland)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `clipio version` and `python --version`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output or screenshot (optional)
      render: text
