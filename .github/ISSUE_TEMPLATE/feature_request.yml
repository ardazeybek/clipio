name: Feature idea
description: Suggest something that would make Clipio more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or the task, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Clipio help? (optional)
