name: release

# Builds the ready-to-install apps when a version tag (v1.2.3) is pushed and attaches them
# to the GitHub release. The download page (docs/index.html) links to these file names.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, asset: Clipio-Setup.exe }
          - { os: ubuntu-22.04, asset: Clipio-Setup-Linux }          # older glibc: runs on more distros
          - { os: macos-latest, asset: Clipio-macOS-AppleSilicon.dmg }
          - { os: macos-15-intel, asset: Clipio-macOS-Intel.dmg }
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Install build tools
        run: python -m pip install . pyinstaller pillow
      - name: Build
        run: |
          python packaging/make_icon.py
          pyinstaller --noconfirm packaging/clipio.spec
      - name: Smoke test the packaged app (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          f=$(ls dist/Clipio-Setup*)
          "$f" version
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/Clipio.app/Contents/MacOS/Clipio version
          mkdir dmg && cp -R dist/Clipio.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Clipio -srcfolder dmg -fs HFS+ -format UDZO "dist/${{ matrix.asset }}"
      - name: Name the file
        if: runner.os != 'macOS'
        shell: bash
        run: mv dist/Clipio-Setup* "dist/${{ matrix.asset }}.tmp" && mv "dist/${{ matrix.asset }}.tmp" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach the apps and the Linux install script to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packaging/install.sh out/
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
