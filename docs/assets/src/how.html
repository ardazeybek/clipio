<!doctype html>
<!-- how.html — source of docs/assets/how.png: how Clipio works: copy, press the shortcut, it is pasted -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>.steps{display:grid;grid-template-columns:1fr 64px 1fr 64px 1fr;align-items:start;margin-top:38px}.st{text-align:center}.st .sheet{height:190px;display:grid;place-items:center;padding:20px}.st .num{margin:-20px auto 0;position:relative;z-index:2;transform:translateY(20px)}.st h2{font-size:26px;margin-top:22px}.st p{font-size:18px;color:var(--ink-2);margin-top:6px;line-height:1.45}.ar{height:190px;display:grid;place-items:center;margin-top:20px}.ar svg{width:52px}.line{height:12px;border-radius:6px;background:var(--edge);margin:7px 0}.hl{background:var(--tape)}.big svg.ic{width:84px;height:84px}</style></head>
<body><div class="panel">
<span class="tape">How it works</span><h1>Three moves. No new habits.</h1>
<div class="steps">
<div class="st"><div class="num">1</div><div class="sheet"><div style="width:190px"><div class="line" style="width:80%"></div><div class="line hl"></div><div class="line" style="width:60%"></div><div style="margin-top:16px"><kbd>Ctrl</kbd> <kbd>C</kbd></div></div></div><h2>Copy as usual</h2><p>Clipio keeps every copy.</p></div><div class="ar"><svg viewBox="0 0 52 24" fill="none" stroke="#C9BBA4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 8"><path d="M3 12h42"/><path d="M38 4l9 8-9 8" stroke-dasharray="none"/></svg></div>
<div class="st"><div class="num">2</div><div class="sheet"><div><div style="display:flex;gap:6px;justify-content:center"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd class="on">V</kbd></div><div class="line" style="width:200px;margin-top:20px;height:16px;border:2px solid var(--accent);background:var(--sheet)"></div><div class="line" style="width:200px"></div></div></div><h2>Press the shortcut</h2><p>Type to search, or pick a card.</p></div><div class="ar"><svg viewBox="0 0 52 24" fill="none" stroke="#C9BBA4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 8"><path d="M3 12h42"/><path d="M38 4l9 8-9 8" stroke-dasharray="none"/></svg></div>
<div class="st"><div class="num">3</div><div class="sheet"><div class="big"><svg class="ic" viewBox="-22 -22 44 44"><circle r="18" fill="#9CC3A6"/><path d="M-8 0l5 5 10-11" fill="none" stroke="#FFFCF5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div><h2>It is pasted</h2><p>Right where you were typing.</p></div>
</div>
</div><script src="icons.js"></script><script src="fit.js"></script></body></html>
