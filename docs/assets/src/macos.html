<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style></style></head>
<body><div class="panel">
<span class="tape sage">macOS</span><h1>Two yeses, asked once.</h1>
<p class="lede">Allow Clipio under <b>System Settings → Privacy &amp; Security</b>.</p>
<div class="g2">
<div class="sheet item"><div class="dot"><i data-ic="paste"></i></div><div><h2>Accessibility</h2><p>So Clipio can paste into other apps. Without it, picking a card copies it and you press ⌘ V.</p></div></div>
<div class="sheet item"><div class="dot"><i data-ic="keyboard"></i></div><div><h2>Input Monitoring</h2><p>So the global shortcut ⌘ ⇧ V works in every app.</p></div></div>
</div>
</div><script src="icons.js"></script><script src="fit.js"></script></body></html>
