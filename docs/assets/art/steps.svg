<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210">
  <!-- How Clipio works in three steps: copy, press the shortcut, it is pasted -->
  <defs>
    <style>
      .t { font-family: Nunito, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .h { font-size: 16px; font-weight: 800; fill: #3D3530; }
      .s { font-size: 12px; font-weight: 600; fill: #9A8E7E; }
      .k { font-size: 11px; font-weight: 800; fill: #3D3530; }
      .num { font-size: 13px; font-weight: 800; fill: #FFFCF5; }
    </style>
  </defs>
  <!-- paper strip behind the steps -->
  <rect x="4" y="14" width="752" height="190" rx="20" fill="#E9DFCB"/>
  <rect x="0" y="8" width="752" height="190" rx="20" fill="#F6EFE1" stroke="#E4D8C2" stroke-width="2"/>
  <rect x="340" y="0" width="72" height="18" rx="2" fill="#F3D9A4" opacity="0.92" transform="rotate(-2 376 9)"/>

  <!-- dashed pencil arrows between the steps -->
  <g fill="none" stroke="#C9BBA4" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 7">
    <path d="M222 92 q28 -16 56 0"/>
    <path d="M474 92 q28 -16 56 0"/>
  </g>
  <g fill="none" stroke="#C9BBA4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M271 86 l7 6 l-8 3"/>
    <path d="M523 86 l7 6 l-8 3"/>
  </g>

  <!-- 1. copy: a note with a highlighted line and the copy keys -->
  <g transform="translate(46 34)">
    <rect x="6" y="6" width="150" height="96" rx="12" fill="#E9DFCB"/>
    <rect x="0" y="0" width="150" height="96" rx="12" fill="#FFFCF5" stroke="#E4D8C2" stroke-width="2"/>
    <rect x="16" y="20" width="92" height="7" rx="3.5" fill="#E4D8C2"/>
    <rect x="14" y="36" width="104" height="13" rx="4" fill="#F3D9A4" opacity="0.8"/>
    <rect x="18" y="39" width="88" height="7" rx="3.5" fill="#B9A98F"/>
    <rect x="16" y="58" width="70" height="7" rx="3.5" fill="#E4D8C2"/>
    <g transform="translate(40 72)">
      <rect width="34" height="18" rx="5" fill="#FFFCF5" stroke="#C9BBA4" stroke-width="1.5"/><text class="t k" x="17" y="13" text-anchor="middle">Ctrl</text>
      <rect x="40" width="22" height="18" rx="5" fill="#FFFCF5" stroke="#C9BBA4" stroke-width="1.5"/><text class="t k" x="51" y="13" text-anchor="middle">C</text>
    </g>
  </g>
  <circle cx="46" cy="34" r="13" fill="#E58F6F"/><text class="t num" x="46" y="39" text-anchor="middle">1</text>
  <text class="t h" x="121" y="160" text-anchor="middle">Copy as usual</text>
  <text class="t s" x="121" y="178" text-anchor="middle">Clipio keeps every copy</text>

  <!-- 2. press the shortcut: the panel with a stack of cards -->
  <g transform="translate(300 28)">
    <rect x="6" y="6" width="152" height="90" rx="14" fill="#E9DFCB"/>
    <rect x="0" y="0" width="152" height="90" rx="14" fill="#F6EFE1" stroke="#E4D8C2" stroke-width="2"/>
    <rect x="12" y="11" width="128" height="16" rx="8" fill="#FFFCF5" stroke="#E58F6F" stroke-width="1.5"/>
    <circle cx="23" cy="19" r="3.5" fill="none" stroke="#E58F6F" stroke-width="1.5"/>
    <rect x="12" y="35" width="128" height="22" rx="7" fill="#FFFCF5" stroke="#E58F6F" stroke-width="2"/>
    <rect x="20" y="43" width="74" height="6" rx="3" fill="#B9A98F"/>
    <rect x="12" y="62" width="128" height="18" rx="7" fill="#FFFCF5" stroke="#E4D8C2" stroke-width="1.5"/>
    <rect x="20" y="68" width="22" height="7" rx="2" fill="#9CC3A6"/><rect x="48" y="69" width="54" height="5" rx="2.5" fill="#E4D8C2"/>
  </g>
  <g transform="translate(316 128)">
    <rect width="34" height="18" rx="5" fill="#FFFCF5" stroke="#C9BBA4" stroke-width="1.5"/><text class="t k" x="17" y="13" text-anchor="middle">Ctrl</text>
    <rect x="40" width="40" height="18" rx="5" fill="#FFFCF5" stroke="#C9BBA4" stroke-width="1.5"/><text class="t k" x="60" y="13" text-anchor="middle">Shift</text>
    <rect x="86" width="34" height="18" rx="5" fill="#E58F6F"/><text class="t k" x="103" y="13" text-anchor="middle" fill="#FFFCF5" style="fill:#FFFCF5">V</text>
  </g>
  <circle cx="300" cy="28" r="13" fill="#E58F6F"/><text class="t num" x="300" y="33" text-anchor="middle">2</text>
  <text class="t h" x="376" y="170" text-anchor="middle">Press the shortcut</text>
  <text class="t s" x="376" y="187" text-anchor="middle">Search or pick a card</text>

  <!-- 3. pasted: a text field receives the card, with a check -->
  <g transform="translate(552 34)">
    <rect x="6" y="6" width="150" height="96" rx="12" fill="#E9DFCB"/>
    <rect x="0" y="0" width="150" height="96" rx="12" fill="#FFFCF5" stroke="#E4D8C2" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="20" rx="12" fill="#F6EFE1"/>
    <rect x="0" y="12" width="150" height="8" fill="#F6EFE1"/>
    <circle cx="14" cy="10" r="3.5" fill="#E58F6F"/><circle cx="26" cy="10" r="3.5" fill="#F3D9A4"/><circle cx="38" cy="10" r="3.5" fill="#9CC3A6"/>
    <rect x="14" y="32" width="84" height="7" rx="3.5" fill="#B9A98F"/>
    <rect x="99" y="29" width="2" height="13" rx="1" fill="#E58F6F"/>
    <rect x="14" y="50" width="110" height="6" rx="3" fill="#E4D8C2"/>
    <rect x="14" y="62" width="76" height="6" rx="3" fill="#E4D8C2"/>
    <circle cx="124" cy="74" r="14" fill="#9CC3A6"/>
    <path d="M117 74 l5 5 l9 -10" fill="none" stroke="#FFFCF5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="552" cy="34" r="13" fill="#E58F6F"/><text class="t num" x="552" y="39" text-anchor="middle">3</text>
  <text class="t h" x="627" y="160" text-anchor="middle">It's pasted</text>
  <text class="t s" x="627" y="178" text-anchor="middle">Right where you were typing</text>
</svg>
